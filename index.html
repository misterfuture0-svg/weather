<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyline Weather — forecasts around the world</title>
<meta name="description" content="Live weather, humidity, wind and 7-day forecast for any city in the world. Uzbek, Russian and English.">
<meta property="og:title" content="Skyline Weather"><meta property="og:description" content="Live weather and 7-day forecast for any city in the world.">
<meta name="theme-color" content="#1f6fc0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--sky1:#2d6fb3;--sky2:#9cc9ee;--ink:#fff;--panel:rgba(255,255,255,.16);--line:rgba(255,255,255,.28);--page:#0f1d2e;--text:#e8f0f8;--muted:#9fb3c8;--bar:#ffd58a}
*{box-sizing:border-box;margin:0}
html,body{background:var(--page);color:var(--text);font-family:'Instrument Sans',system-ui,sans-serif;min-height:100%}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hero{background:linear-gradient(170deg,var(--sky1),var(--sky2));color:var(--ink);padding:20px 20px 36px;transition:background .6s}
.wrap{max-width:980px;margin:0 auto}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.brand{font-family:Fraunces,serif;font-size:20px;font-weight:600}
.tools{display:flex;gap:8px;flex:1;max-width:520px;min-width:240px;position:relative}
.tools input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 16px;color:#fff;min-width:0}
.tools input::placeholder{color:rgba(255,255,255,.75)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.26)}
#sugg{position:absolute;top:46px;left:0;right:0;background:#fff;color:#12263a;border-radius:14px;overflow:hidden;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#sugg button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 16px;cursor:pointer}
#sugg button:hover{background:#eef4fa}
.now{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;margin-top:44px}
.place{font-family:Fraunces,serif;font-weight:300;font-size:clamp(34px,7vw,64px);line-height:1}
.sub{margin-top:8px;opacity:.9}
.temp{font-family:Fraunces,serif;font-weight:300;font-size:clamp(80px,17vw,168px);line-height:.85;letter-spacing:-.04em}
.cond{font-size:22px;margin-top:10px;text-align:right}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:34px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-size:24px;font-weight:500;margin-top:4px}
.stat span{font-size:13px;opacity:.85}
main{padding:28px 20px 56px}
h2{font-family:Fraunces,serif;font-weight:600;font-size:22px;margin-bottom:14px}
.days{border-top:1px solid #243a52}
.day{display:grid;grid-template-columns:90px 36px 1fr 120px;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #243a52}
.day .n{font-weight:600}
.range{display:flex;align-items:center;gap:10px}
.track{flex:1;height:8px;border-radius:99px;background:#1c3047;position:relative}
.fill{position:absolute;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#7fc4ff,var(--bar))}
.lo,.hi{width:38px;font-variant-numeric:tabular-nums}
.lo{color:var(--muted);text-align:right}
.meta{font-size:13px;color:var(--muted);text-align:right}
.world{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:40px}
.city{background:#162a40;border:1px solid #243a52;border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left}
.city:hover{border-color:#5d86b0}
.city small{color:var(--muted);display:block}
.city .t{float:right;font-family:Fraunces,serif;font-size:26px;line-height:1}
.err{padding:20px;color:#ffd2d2}
footer{color:var(--muted);font-size:13px;padding:0 20px 40px;text-align:center}
footer a{color:#cfe3f8}
#lang option{color:#12263a}
.hours{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.hr{flex:0 0 66px;background:#162a40;border:1px solid #243a52;border-radius:12px;padding:10px 6px;text-align:center}
.hr small{color:var(--muted);display:block}.hr span{display:block;margin:4px 0}.hr b{font-weight:500}
@media(max-width:640px){.now{grid-template-columns:1fr}.cond{text-align:left}.stats{grid-template-columns:repeat(2,1fr)}.day{grid-template-columns:64px 30px 1fr}.meta{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="hero" id="hero">
 <div class="wrap">
  <div class="top">
   <div class="brand">Skyline Weather</div>
   <div class="tools">
    <input id="q" type="search" placeholder="Search any city in the world" autocomplete="off" aria-label="Search city">
    <button class="btn" id="geo" data-t="my"></button><select class="btn" id="lang" aria-label="Language"><option value="uz">O‘zbekcha</option><option value="ru">Русский</option><option value="en">English</option></select>
    <button class="btn" id="unit" aria-label="Switch units">°C</button>
    <div id="sugg" hidden></div>
   </div>
  </div>
  <div class="now">
   <div><h1 class="place" id="place">Loading…</h1><p class="sub" id="local"></p></div>
   <div><div class="temp" id="temp">--°</div><div class="cond" id="cond"></div></div>
  </div>
  <div class="stats"><div class="stat"><span data-t="feel"></span><b id="feel">--</b></div><div class="stat"><span data-t="hum"></span><b id="hum">--</b></div><div class="stat"><span data-t="wind"></span><b id="wind">--</b></div><div class="stat"><span data-t="rain"></span><b id="rain">--</b></div><div class="stat"><span data-t="sun"></span><b id="sun">--</b></div><div class="stat"><span data-t="uv"></span><b id="uvi">--</b></div></div>
 </div>
</header>
<main><div class="wrap">
 <h2 data-t="hourly"></h2><div class="hours" id="hours"></div><h2 data-t="next7" style="margin-top:36px"></h2>
 <div class="days" id="days"></div>
 <div class="world-wrap"><h2 style="margin-top:44px" data-t="world"></h2><div class="world" id="world"></div></div>
</div></main>
<footer>Weather data by <a href="https://open-meteo.com/">Open-Meteo.com</a></footer>

<script>
const WC={0:[0,'☀️'],1:[1,'🌤️'],2:[2,'⛅'],3:[3,'☁️'],45:[4,'🌫️'],48:[4,'🌫️'],51:[5,'🌦️'],53:[5,'🌦️'],55:[5,'🌧️'],56:[8,'🌧️'],57:[8,'🌧️'],61:[6,'🌦️'],63:[6,'🌧️'],65:[7,'🌧️'],66:[8,'🌧️'],67:[8,'🌧️'],71:[9,'🌨️'],73:[9,'❄️'],75:[10,'❄️'],77:[9,'❄️'],80:[11,'🌦️'],81:[11,'🌧️'],82:[11,'⛈️'],85:[11,'🌨️'],86:[11,'🌨️'],95:[12,'⛈️'],96:[12,'⛈️'],99:[12,'⛈️']};
const L={
en:{ph:'Search any city in the world',my:'My location',feel:'Feels like',hum:'Humidity',wind:'Wind',rain:'Rain chance today',sun:'Sunrise · Sunset',uv:'UV index',next7:'Next 7 days',hourly:'Next 24 hours',world:'Around the world right now',today:'Today',now:'Now',time:'Local time',load:'Loading…',err:'Could not load the forecast. The weather service may be busy or blocked on your network.',retry:'Try again',off:'No connection to the weather service. Showing the last saved forecast.',nf:'No city found',su:'Search is unavailable right now. Try again.',lb:'Location is blocked in your browser. Search for a city instead.',werr:'Could not load the world cities.',kmh:'km/h',c:['Clear sky','Mostly clear','Partly cloudy','Overcast','Fog','Drizzle','Rain','Heavy rain','Freezing rain','Snow','Heavy snow','Showers','Thunderstorm']},
ru:{ph:'Поиск любого города мира',my:'Моё место',feel:'Ощущается',hum:'Влажность',wind:'Ветер',rain:'Вероятность осадков',sun:'Восход · Закат',uv:'УФ-индекс',next7:'Прогноз на 7 дней',hourly:'Ближайшие 24 часа',world:'Мир прямо сейчас',today:'Сегодня',now:'Сейчас',time:'Местное время',load:'Загрузка…',err:'Не удалось загрузить прогноз. Сервис погоды может быть занят или заблокирован в вашей сети.',retry:'Повторить',off:'Нет связи с сервисом погоды. Показан последний сохранённый прогноз.',nf:'Город не найден',su:'Поиск сейчас недоступен. Повторите позже.',lb:'Доступ к местоположению заблокирован. Найдите город через поиск.',werr:'Не удалось загрузить города мира.',kmh:'км/ч',c:['Ясно','Преимущественно ясно','Переменная облачность','Пасмурно','Туман','Морось','Дождь','Сильный дождь','Ледяной дождь','Снег','Сильный снег','Ливень','Гроза']},
uz:{ph:"Dunyodagi istalgan shaharni qidiring",my:"Mening joylashuvim",feel:"His qilinadi",hum:"Namlik",wind:"Shamol",rain:"Yog'ingarchilik ehtimoli",sun:"Quyosh chiqishi · botishi",uv:"UV indeksi",next7:"Keyingi 7 kun",hourly:"Keyingi 24 soat",world:"Hozir dunyoda",today:"Bugun",now:"Hozir",time:"Mahalliy vaqt",load:"Yuklanmoqda…",err:"Ob-havo ma'lumotini yuklab bo'lmadi. Xizmat band yoki tarmog'ingizda bloklangan bo'lishi mumkin.",retry:"Qayta urinish",off:"Ob-havo xizmatiga ulanib bo'lmadi. Oxirgi saqlangan prognoz ko'rsatilmoqda.",nf:"Shahar topilmadi",su:"Qidiruv hozir mavjud emas. Qayta urinib ko'ring.",lb:"Joylashuvga ruxsat bloklangan. Shaharni qidiruv orqali toping.",werr:"Dunyo shaharlarini yuklab bo'lmadi.",kmh:"km/soat",c:["Ochiq osmon","Asosan ochiq","Qisman bulutli","Bulutli","Tuman","Mayda yomg'ir","Yomg'ir","Kuchli yomg'ir","Muzlovchi yomg'ir","Qor","Kuchli qor","Jala","Momaqaldiroq"]}};
const CITIES=[['Tashkent','Uzbekistan',41.31,69.24],['London','UK',51.51,-0.13],['New York','USA',40.71,-74.01],['Tokyo','Japan',35.68,139.69],['Dubai','UAE',25.2,55.27],['Moscow','Russia',55.76,37.62],['Istanbul','Türkiye',41.01,28.98],['Sydney','Australia',-33.87,151.21],['Cairo','Egypt',30.04,31.24],['Sao Paulo','Brazil',-23.55,-46.63],['Delhi','India',28.61,77.21],['Reykjavik','Iceland',64.15,-21.94]];
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
let lang=lsGet('lang')||{uz:'uz',ru:'ru'}[(navigator.language||'en').slice(0,2)]||'en';
let F=lsGet('unit')==='F',cur=null,data=null,last=null;
const $=id=>document.getElementById(id),t=k=>L[lang][k];
const T=c=>Math.round(F?c*9/5+32:c);
const W=k=>F?Math.round(k*.621)+' mph':Math.round(k)+' '+t('kmh');
const cond=c=>{const w=WC[c]||[3,''];return [t('c')[w[0]],w[1]]};
const hm=s=>s.slice(11,16);
const API='https://api.open-meteo.com/v1/forecast?timezone=auto&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,relative_humidity_2m_mean,sunrise,sunset,uv_index_max&forecast_days=7';
function sky(code,day){let a,b;
 if(!day){a='#0b1630';b='#2b3f73'}
 else if([95,96,99].includes(code)){a='#2c3347';b='#6b7590'}
 else if([71,73,75,77,85,86].includes(code)){a='#7d93ab';b='#d6e2ee'}
 else if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)){a='#41576f';b='#8ea4ba'}
 else if([3,45,48].includes(code)){a='#5b7893';b='#b7c8d8'}
 else {a='#1f6fc0';b='#9ed2f5'}
 const r=$('hero').style;r.setProperty('--sky1',a);r.setProperty('--sky2',b);
 document.querySelector('meta[name=theme-color]').content=a}
async function getJSON(url,tries=3){
 for(let i=0;i<tries;i++){
  try{const ac=new AbortController(),m=setTimeout(()=>ac.abort(),10000);
   const r=await fetch(url,{signal:ac.signal});clearTimeout(m);if(r.ok)return await r.json()}catch(e){}
  await new Promise(z=>setTimeout(z,700*(i+1)));
 }
 throw new Error('failed')}
async function load(p){
 last=p;$('place').textContent=p.name;$('local').textContent=t('load');
 const key='wx2:'+p.lat.toFixed(2)+','+p.lon.toFixed(2);
 try{
  data=await getJSON(API+'&hourly=temperature_2m,weather_code&latitude='+p.lat+'&longitude='+p.lon);cur=p;render();
  lsSet(key,JSON.stringify(data));
 }catch(e){
  const c=lsGet(key);
  if(c){data=JSON.parse(c);cur=p;render();$('local').textContent=t('off')}
  else $('days').innerHTML='<p class="err">'+t('err')+' <button class="btn" onclick="load(last)">'+t('retry')+'</button></p>'
 }}
function render(){
 const c=data.current,d=data.daily,h=data.hourly,w=cond(c.weather_code);
 $('place').textContent=cur.name;
 $('local').textContent=(cur.country?cur.country+' · ':'')+t('time')+' '+hm(c.time);
 $('temp').textContent=T(c.temperature_2m)+'°';
 $('cond').textContent=w[1]+' '+w[0];
 $('feel').textContent=T(c.apparent_temperature)+'°';
 $('hum').textContent=c.relative_humidity_2m+'%';
 $('wind').textContent=W(c.wind_speed_10m);
 $('rain').textContent=(d.precipitation_probability_max[0]??0)+'%';
 $('sun').textContent=hm(d.sunrise[0])+' · '+hm(d.sunset[0]);
 $('uvi').textContent=Math.round(d.uv_index_max[0]);
 sky(c.weather_code,c.is_day);
 const i0=Math.max(0,h.time.findIndex(x=>x>=c.time.slice(0,13)+':00'));
 $('hours').innerHTML=h.time.slice(i0,i0+24).map((x,j)=>{const k=i0+j;return `<div class="hr"><small>${j?hm(x):t('now')}</small><span>${cond(h.weather_code[k])[1]}</span><b>${T(h.temperature_2m[k])}°</b></div>`}).join('');
 const lo=Math.min(...d.temperature_2m_min),hi=Math.max(...d.temperature_2m_max),span=(hi-lo)||1;
 $('days').innerHTML=d.time.map((x,i)=>{
  const n=i===0?t('today'):new Date(x+'T12:00').toLocaleDateString(lang,{weekday:'short',day:'numeric'});
  const l=(d.temperature_2m_min[i]-lo)/span*100,r=(d.temperature_2m_max[i]-lo)/span*100,e=cond(d.weather_code[i]);
  return `<div class="day"><span class="n">${n}</span><span title="${e[0]}">${e[1]}</span><div class="range"><span class="lo">${T(d.temperature_2m_min[i])}°</span><div class="track"><div class="fill" style="left:${l}%;right:${100-r}%"></div></div><span class="hi">${T(d.temperature_2m_max[i])}°</span></div><span class="meta">💧 ${d.relative_humidity_2m_mean[i]}% · 💨 ${W(d.wind_speed_10m_max[i])}</span></div>`}).join('')}
async function loadWorld(){
 try{
  window.WD=await getJSON(API.replace('&forecast_days=7','&forecast_days=1')+'&latitude='+CITIES.map(c=>c[2]).join(',')+'&longitude='+CITIES.map(c=>c[3]).join(','));
  drawWorld();
 }catch(e){$('world').innerHTML='<p class="err" style="grid-column:1/-1">'+t('werr')+' <button class="btn" onclick="loadWorld()">'+t('retry')+'</button></p>'}}
function drawWorld(){
 if(!window.WD)return;
 $('world').innerHTML=CITIES.map((c,i)=>{const k=WD[i].current,e=cond(k.weather_code);return `<button class="city" data-i="${i}"><span class="t">${T(k.temperature_2m)}°</span><b>${c[0]}</b><small>${e[1]} ${e[0]}</small></button>`}).join('')}
$('world').onclick=e=>{const b=e.target.closest('.city');if(!b)return;const c=CITIES[b.dataset.i];load({name:c[0],country:c[1],lat:c[2],lon:c[3]});scrollTo({top:0,behavior:'smooth'})};
let tm;$('q').oninput=e=>{clearTimeout(tm);const v=e.target.value.trim();if(v.length<2){$('sugg').hidden=true;return}
 tm=setTimeout(async()=>{try{const r=await getJSON('https://geocoding-api.open-meteo.com/v1/search?count=6&language='+lang+'&name='+encodeURIComponent(v),2);
  const R=r.results||[];$('sugg').innerHTML=R.length?R.map((x,i)=>`<button data-i="${i}">${x.name}${x.admin1?', '+x.admin1:''} — ${x.country||''}</button>`).join(''):'<button disabled>'+t('nf')+'</button>';
  $('sugg').hidden=false;$('sugg').onclick=ev=>{const b=ev.target.closest('button');if(!b||b.disabled)return;const x=R[b.dataset.i];$('sugg').hidden=true;$('q').value='';load({name:x.name,country:x.country,lat:x.latitude,lon:x.longitude})}}catch(e){$('sugg').innerHTML='<button disabled>'+t('su')+'</button>';$('sugg').hidden=false}},250)};
document.addEventListener('click',e=>{if(!e.target.closest('.tools'))$('sugg').hidden=true});
$('unit').onclick=()=>{F=!F;lsSet('unit',F?'F':'C');$('unit').textContent=F?'°F':'°C';if(data)render();drawWorld()};
$('geo').onclick=()=>{if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>load({name:'📍',country:'',lat:p.coords.latitude,lon:p.coords.longitude}),()=>{$('local').textContent=t('lb')})};
function applyLang(){
 document.documentElement.lang=lang;$('lang').value=lang;$('q').placeholder=t('ph');
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
 if(data)render();drawWorld()}
$('lang').onchange=e=>{lang=e.target.value;lsSet('lang',lang);applyLang()};
$('unit').textContent=F?'°F':'°C';applyLang();
load({name:'Tashkent',country:'Uzbekistan',lat:41.31,lon:69.24});loadWorld();
</script>
</body>
</html>
