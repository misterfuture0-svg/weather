<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyline Weather — forecasts around the world</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--sky1:#2d6fb3;--sky2:#9cc9ee;--ink:#fff;--panel:rgba(255,255,255,.16);--line:rgba(255,255,255,.28);--page:#0f1d2e;--text:#e8f0f8;--muted:#9fb3c8;--bar:#ffd58a}
*{box-sizing:border-box;margin:0}
html,body{background:var(--page);color:var(--text);font-family:'Instrument Sans',system-ui,sans-serif;min-height:100%}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hero{background:linear-gradient(170deg,var(--sky1),var(--sky2));color:var(--ink);padding:20px 20px 36px;transition:background .6s}
.wrap{max-width:980px;margin:0 auto}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.brand{font-family:Fraunces,serif;font-size:20px;font-weight:600}
.tools{display:flex;gap:8px;flex:1;max-width:520px;min-width:240px;position:relative}
.tools input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 16px;color:#fff;min-width:0}
.tools input::placeholder{color:rgba(255,255,255,.75)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.26)}
#sugg{position:absolute;top:46px;left:0;right:0;background:#fff;color:#12263a;border-radius:14px;overflow:hidden;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#sugg button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 16px;cursor:pointer}
#sugg button:hover{background:#eef4fa}
.now{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;margin-top:44px}
.place{font-family:Fraunces,serif;font-weight:300;font-size:clamp(34px,7vw,64px);line-height:1}
.sub{margin-top:8px;opacity:.9}
.temp{font-family:Fraunces,serif;font-weight:300;font-size:clamp(80px,17vw,168px);line-height:.85;letter-spacing:-.04em}
.cond{font-size:22px;margin-top:10px;text-align:right}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:34px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-size:24px;font-weight:500;margin-top:4px}
.stat span{font-size:13px;opacity:.85}
main{padding:28px 20px 56px}
h2{font-family:Fraunces,serif;font-weight:600;font-size:22px;margin-bottom:14px}
.days{border-top:1px solid #243a52}
.day{display:grid;grid-template-columns:90px 36px 1fr 120px;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #243a52}
.day .n{font-weight:600}
.range{display:flex;align-items:center;gap:10px}
.track{flex:1;height:8px;border-radius:99px;background:#1c3047;position:relative}
.fill{position:absolute;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#7fc4ff,var(--bar))}
.lo,.hi{width:38px;font-variant-numeric:tabular-nums}
.lo{color:var(--muted);text-align:right}
.meta{font-size:13px;color:var(--muted);text-align:right}
.world{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:40px}
.city{background:#162a40;border:1px solid #243a52;border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left}
.city:hover{border-color:#5d86b0}
.city small{color:var(--muted);display:block}
.city .t{float:right;font-family:Fraunces,serif;font-size:26px;line-height:1}
.err{padding:20px;color:#ffd2d2}
footer{color:var(--muted);font-size:13px;padding:0 20px 40px;text-align:center}
footer a{color:#cfe3f8}
@media(max-width:640px){.now{grid-template-columns:1fr}.cond{text-align:left}.stats{grid-template-columns:repeat(2,1fr)}.day{grid-template-columns:64px 30px 1fr}.meta{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="hero" id="hero">
 <div class="wrap">
  <div class="top">
   <div class="brand">Skyline Weather</div>
   <div class="tools">
    <input id="q" type="search" placeholder="Search any city in the world" autocomplete="off" aria-label="Search city">
    <button class="btn" id="geo" title="Use my location">My location</button>
    <button class="btn" id="unit" aria-label="Switch units">°C</button>
    <div id="sugg" hidden></div>
   </div>
  </div>
  <div class="now">
   <div><h1 class="place" id="place">Loading…</h1><p class="sub" id="local"></p></div>
   <div><div class="temp" id="temp">--°</div><div class="cond" id="cond"></div></div>
  </div>
  <div class="stats">
   <div class="stat"><span>Feels like</span><b id="feel">--</b></div>
   <div class="stat"><span>Humidity</span><b id="hum">--</b></div>
   <div class="stat"><span>Wind</span><b id="wind">--</b></div>
   <div class="stat"><span>Rain chance today</span><b id="rain">--</b></div>
  </div>
 </div>
</header>
<main><div class="wrap">
 <h2>Next 7 days</h2>
 <div class="days" id="days"></div>
 <div class="world-wrap"><h2 style="margin-top:44px">Around the world right now</h2><div class="world" id="world"></div></div>
</div></main>
<footer>Weather data by <a href="https://open-meteo.com/">Open-Meteo.com</a></footer>

<script>
const WC={0:['Clear sky','☀️'],1:['Mostly clear','🌤️'],2:['Partly cloudy','⛅'],3:['Overcast','☁️'],45:['Fog','🌫️'],48:['Rime fog','🌫️'],51:['Light drizzle','🌦️'],53:['Drizzle','🌦️'],55:['Heavy drizzle','🌧️'],56:['Freezing drizzle','🌧️'],57:['Freezing drizzle','🌧️'],61:['Light rain','🌦️'],63:['Rain','🌧️'],65:['Heavy rain','🌧️'],66:['Freezing rain','🌧️'],67:['Freezing rain','🌧️'],71:['Light snow','🌨️'],73:['Snow','❄️'],75:['Heavy snow','❄️'],77:['Snow grains','❄️'],80:['Rain showers','🌦️'],81:['Rain showers','🌧️'],82:['Violent showers','⛈️'],85:['Snow showers','🌨️'],86:['Snow showers','🌨️'],95:['Thunderstorm','⛈️'],96:['Thunderstorm, hail','⛈️'],99:['Thunderstorm, hail','⛈️']};
const CITIES=[['Tashkent','Uzbekistan',41.31,69.24],['London','UK',51.51,-0.13],['New York','USA',40.71,-74.01],['Tokyo','Japan',35.68,139.69],['Dubai','UAE',25.2,55.27],['Moscow','Russia',55.76,37.62],['Istanbul','Türkiye',41.01,28.98],['Sydney','Australia',-33.87,151.21],['Cairo','Egypt',30.04,31.24],['Sao Paulo','Brazil',-23.55,-46.63],['Delhi','India',28.61,77.21],['Reykjavik','Iceland',64.15,-21.94]];
let F=localStorageGet('unit')==='F',cur=null,data=null;
function localStorageGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function localStorageSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const $=id=>document.getElementById(id);
const T=c=>Math.round(F?c*9/5+32:c);
const W=k=>F?Math.round(k*.621)+' mph':Math.round(k)+' km/h';
const API='https://api.open-meteo.com/v1/forecast?timezone=auto&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,relative_humidity_2m_mean&forecast_days=7';
function sky(code,day){let a,b;
 if(!day){a='#0b1630';b='#2b3f73'}
 else if([95,96,99].includes(code)){a='#2c3347';b='#6b7590'}
 else if([71,73,75,77,85,86].includes(code)){a='#7d93ab';b='#d6e2ee'}
 else if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)){a='#41576f';b='#8ea4ba'}
 else if([3,45,48].includes(code)){a='#5b7893';b='#b7c8d8'}
 else {a='#1f6fc0';b='#9ed2f5'}
 const r=$('hero').style;r.setProperty('--sky1',a);r.setProperty('--sky2',b)}
async function load(p){
 try{
  $('place').textContent=p.name;
  const r=await fetch(API+`&latitude=${p.lat}&longitude=${p.lon}`);
  if(!r.ok)throw 0;
  data=await r.json();cur=p;render();
 }catch(e){$('days').innerHTML='<p class="err">Could not load the forecast. Check your connection and try again.</p>'}}
function render(){
 const c=data.current,d=data.daily,w=WC[c.weather_code]||['—',''];
 $('place').textContent=cur.name;
 $('local').textContent=(cur.country?cur.country+' · ':'')+'Local time '+new Date(c.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
 $('temp').textContent=T(c.temperature_2m)+'°';
 $('cond').textContent=w[1]+' '+w[0];
 $('feel').textContent=T(c.apparent_temperature)+'°';
 $('hum').textContent=c.relative_humidity_2m+'%';
 $('wind').textContent=W(c.wind_speed_10m);
 $('rain').textContent=(d.precipitation_probability_max[0]??0)+'%';
 sky(c.weather_code,c.is_day);
 const lo=Math.min(...d.temperature_2m_min),hi=Math.max(...d.temperature_2m_max),span=(hi-lo)||1;
 $('days').innerHTML=d.time.map((t,i)=>{
  const dt=new Date(t+'T12:00'),n=i===0?'Today':dt.toLocaleDateString([], {weekday:'short',day:'numeric'});
  const l=(d.temperature_2m_min[i]-lo)/span*100,r=(d.temperature_2m_max[i]-lo)/span*100,x=WC[d.weather_code[i]]||['',''];
  return `<div class="day"><span class="n">${n}</span><span title="${x[0]}">${x[1]}</span><div class="range"><span class="lo">${T(d.temperature_2m_min[i])}°</span><div class="track"><div class="fill" style="left:${l}%;right:${100-r}%"></div></div><span class="hi">${T(d.temperature_2m_max[i])}°</span></div><span class="meta">💧 ${d.relative_humidity_2m_mean[i]}% · 💨 ${W(d.wind_speed_10m_max[i])}</span></div>`}).join('')}
async function loadWorld(){
 try{
  const r=await fetch(API.replace('&forecast_days=7','&forecast_days=1')+`&latitude=${CITIES.map(c=>c[2]).join(',')}&longitude=${CITIES.map(c=>c[3]).join(',')}`);
  window.WD=await r.json();drawWorld();
 }catch(e){}}
function drawWorld(){
 if(!window.WD)return;
 $('world').innerHTML=CITIES.map((c,i)=>{const k=WD[i].current;return `<button class="city" data-i="${i}"><span class="t">${T(k.temperature_2m)}°</span><b>${c[0]}</b><small>${(WC[k.weather_code]||['',''])[1]} ${(WC[k.weather_code]||['—'])[0]}</small></button>`}).join('')}
$('world').onclick=e=>{const b=e.target.closest('.city');if(!b)return;const c=CITIES[b.dataset.i];load({name:c[0],country:c[1],lat:c[2],lon:c[3]});scrollTo({top:0,behavior:'smooth'})};
let tm;$('q').oninput=e=>{clearTimeout(tm);const v=e.target.value.trim();if(v.length<2){$('sugg').hidden=true;return}
 tm=setTimeout(async()=>{try{const r=await(await fetch('https://geocoding-api.open-meteo.com/v1/search?count=6&name='+encodeURIComponent(v))).json();
  const L=r.results||[];$('sugg').innerHTML=L.length?L.map((x,i)=>`<button data-i="${i}">${x.name}${x.admin1?', '+x.admin1:''} — ${x.country||''}</button>`).join(''):'<button disabled>No city found</button>';
  $('sugg').hidden=false;$('sugg').onclick=ev=>{const b=ev.target.closest('button');if(!b||b.disabled)return;const x=L[b.dataset.i];$('sugg').hidden=true;$('q').value='';load({name:x.name,country:x.country,lat:x.latitude,lon:x.longitude})}}catch(e){}},250)};
document.addEventListener('click',e=>{if(!e.target.closest('.tools'))$('sugg').hidden=true});
$('unit').onclick=()=>{F=!F;localStorageSet('unit',F?'F':'C');$('unit').textContent=F?'°F':'°C';if(data)render();drawWorld()};
$('geo').onclick=()=>{if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>load({name:'Your location',country:'',lat:p.coords.latitude,lon:p.coords.longitude}),()=>{})};
$('unit').textContent=F?'°F':'°C';
load({name:'Tashkent',country:'Uzbekistan',lat:41.31,lon:69.24});loadWorld();
</script>
</body>
</html>
